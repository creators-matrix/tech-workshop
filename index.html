function createToolCard(t) {
    var c = document.createElement('a');
    c.href = t.href;
    c.className = 'block bg-stone-900 border border-stone-700 rounded-xl p-5 hover:border-emerald-500 transition-colors group';
    c.innerHTML = '<div class="text-3xl mb-3">'+t.icon+'</div>'+
        '<h3 class="text-base font-bold text-stone-100 mb-2 group-hover:text-emerald-400 transition-colors">'+t.name+'</h3>'+
        '<p class="text-xs text-stone-400 leading-relaxed mb-3">'+t.desc+'</p>'+
        '<div class="flex flex-wrap gap-1.5">'+t.tags.map(function(x){return '<span class="text-[10px] bg-stone-800 text-emerald-400 border border-emerald-900 px-2 py-0.5 rounded font-mono">'+x+'</span>';}).join('')+'</div>';
    return c;
}

document.addEventListener('DOMContentLoaded', function() {
    var container = document.getElementById('toolsContainer');
    toolsData.forEach(function(t) { container.appendChild(createToolCard(t)); });
});
