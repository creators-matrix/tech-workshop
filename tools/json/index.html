<body class="bg-stone-950 text-stone-200 min-h-screen flex flex-col font-sans">

<header class="border-b border-stone-800 bg-stone-950 px-6 py-5">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
            <div class="text-[11px] text-stone-500 font-mono mb-1">
                <a href="../../../" class="hover:text-emerald-400 transition-colors">Matrix</a>
                <span class="text-stone-700"> / </span>
                <a href="../../" class="hover:text-emerald-400 transition-colors">Tech Workshop</a>
                <span class="text-stone-700"> / </span>
                <span class="text-emerald-400">JSON Formatter</span>
            </div>
            <h1 class="text-xl font-black text-stone-100 tracking-tight">{ } JSON <span class="text-emerald-400">格式化校验器</span></h1>
        </div>
        <a href="../../" class="text-xs text-stone-500 hover:text-emerald-400 border border-stone-700 rounded-lg px-3 py-1.5 transition-colors shrink-0">← 返回工坊</a>
    </div>
</header>

<main class="max-w-4xl mx-auto p-6 flex-grow">

<section class="bg-stone-900 border border-stone-700 rounded-xl p-6 mb-6">
    <h2 class="text-sm text-stone-400 uppercase tracking-widest border-b border-stone-800 pb-2 mb-4">// JSON_FORMATTER / 格式化与校验</h2>
    <div class="flex gap-2 mb-4">
        <button onclick="formatJSON()" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold px-4 py-2 rounded text-xs tracking-wider transition">美化 / FORMAT</button>
        <button onclick="minifyJSON()" class="bg-stone-700 hover:bg-stone-600 text-stone-200 font-bold px-4 py-2 rounded text-xs tracking-wider transition">压缩 / MINIFY</button>
        <button onclick="validateJSON()" class="bg-stone-700 hover:bg-stone-600 text-stone-200 font-bold px-4 py-2 rounded text-xs tracking-wider transition">校验 / VALIDATE</button>
        <button onclick="clearAll()" class="border border-stone-700 text-stone-400 hover:text-stone-200 px-4 py-2 rounded text-xs transition">清空</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs text-emerald-400 mb-1 font-bold">输入 JSON</label>
            <textarea id="inputJSON" rows="14" placeholder='{"name":"老码农","age":47}' class="w-full bg-stone-800 border border-stone-700 rounded-lg p-3 text-stone-200 text-sm font-mono focus:outline-none focus:border-emerald-500 resize-none"></textarea>
        </div>
        <div>
            <label class="block text-xs text-emerald-400 mb-1 font-bold">输出结果</label>
            <textarea id="outputJSON" rows="14" readonly placeholder="格式化结果将显示在这里..." class="w-full bg-stone-800 border border-stone-700 rounded-lg p-3 text-stone-200 text-sm font-mono focus:outline-none resize-none"></textarea>
            <div id="statusMsg" class="text-[10px] mt-2"></div>
        </div>
    </div>
</section>

<div class="tool-footer-note max-w-none">
    <hr class="border-stone-800 my-4">
    <p class="text-xs text-stone-500 leading-relaxed mb-2">📝 这个工具是因为调试API时对着压缩成一行的JSON眼花——找了一个小时才发现少了一个逗号。后来每次拿到response第一件事就是格式化。</p>
    <p class="text-xs text-stone-500 leading-relaxed">代码很糙，但能用。如果对你有用，欢迎<a href="../../../support.html" class="text-emerald-400 underline hover:text-emerald-300">请我喝杯咖啡</a>。</p>
</div>

</main>

<footer class="border-t border-stone-800 bg-stone-950 px-6 py-6">
    <div class="max-w-4xl mx-auto text-center space-y-2">
        <p class="text-[11px] text-stone-500">© 2026 laomunong.com All Rights Reserved.</p>
        <p class="text-[10px] text-stone-600">🛡️ 本工具为纯客户端运行，JSON数据绝不离开浏览器。</p>
        <a href="../../../privacy-policy.html" class="text-[10px] text-stone-500 underline hover:text-emerald-400 transition-colors">隐私政策 / Privacy Policy</a>
    </div>
</footer>

<script>
function formatJSON() {
    var input = document.getElementById('inputJSON').value.trim();
    if (!input) { showStatus('请输入JSON', 'text-stone-500'); return; }
    try {
        var obj = JSON.parse(input);
        document.getElementById('outputJSON').value = JSON.stringify(obj, null, 2);
        showStatus('✅ 格式化成功', 'text-emerald-400');
    } catch(e) {
        document.getElementById('outputJSON').value = '';
        showStatus('❌ JSON语法错误: ' + e.message, 'text-red-400');
    }
}

function minifyJSON() {
    var input = document.getElementById('inputJSON').value.trim();
    if (!input) { showStatus('请输入JSON', 'text-stone-500'); return; }
    try {
        var obj = JSON.parse(input);
        document.getElementById('outputJSON').value = JSON.stringify(obj);
        showStatus('✅ 压缩成功 (' + JSON.stringify(obj).length + ' 字符)', 'text-emerald-400');
    } catch(e) {
        document.getElementById('outputJSON').value = '';
        showStatus('❌ JSON语法错误: ' + e.message, 'text-red-400');
    }
}

function validateJSON() {
    var input = document.getElementById('inputJSON').value.trim();
    if (!input) { showStatus('请输入JSON', 'text-stone-500'); return; }
    try {
        var obj = JSON.parse(input);
        var type = Array.isArray(obj) ? '数组' : '对象';
        var keys = typeof obj === 'object' && obj !== null ? Object.keys(obj).length : 0;
        showStatus('✅ 合法JSON (' + type + ', ' + keys + ' 个键/元素)', 'text-emerald-400');
    } catch(e) {
        showStatus('❌ 非法JSON: ' + e.message, 'text-red-400');
    }
}

function clearAll() {
    document.getElementById('inputJSON').value = '';
    document.getElementById('outputJSON').value = '';
    showStatus('', '');
}

function showStatus(msg, cls) {
    var el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'text-[10px] mt-2 ' + cls;
}
</script>
</body>
</html>
